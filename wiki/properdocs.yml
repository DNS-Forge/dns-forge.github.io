site_name: DNS Forge Wiki
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
    - search.share

extra_css:
  - assets/css/theme.css

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: 01-getting-started/installation.md
  - Architecture:
      - Manifest: 02-architecture/manifest.md
  - Technical Reference: 03-technical-reference/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
